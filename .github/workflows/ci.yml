# The Linux checks, on every pull request and on each push to main. `pnpm check:local` is the same set run by hand,
# plus the visual spec, which has no Linux baselines yet.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm dlx markdownlint-cli2@0.23.2
      - run: pnpm knip
      - run: pnpm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AGENT_BOARD_E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Electron's libraries, and the virtual display and window manager scripts/e2e-headless.sh runs the tests on.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libgtk-3-0t64 libatk-bridge2.0-0t64 libasound2t64 xvfb openbox
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: sh scripts/e2e-headless.sh pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: apps/desktop/test-results/
          retention-days: 7
